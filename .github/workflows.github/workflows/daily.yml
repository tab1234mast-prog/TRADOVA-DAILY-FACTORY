
name: TRADOVA Daily Video Factory

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create TRADOVA video
        run: python main.py

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: TRADOVA-Daily-Video
          path: tradova_daily.mp4
          retention-days: 7
